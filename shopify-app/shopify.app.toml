# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3aa81dc01db00234ff56592be7c9a404"
name = "Gazaarabia Dev"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
# MODE A — LOCALHOST DEVELOPMENT. No webhook subscription blocks here on purpose.
# `--use-localhost` is NOT compatible with webhooks: Shopify rejects localhost
# endpoints ("Invalid value: ...localhost... for: uri"), which makes the dev
# preview fail to start. Webhook subscriptions live in shopify.app.webhooks.toml
# (Mode B, tunnel) and shopify.app.production.toml — never removed, just moved.
api_version = "2026-10"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,read_orders,read_products,write_orders"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]
