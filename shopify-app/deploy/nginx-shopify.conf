# Gazaarabia Shopify app — nginx reverse proxy.
# Put this at /etc/nginx/sites-available/shopify.gazaarabia.com and symlink into
# sites-enabled, then get TLS with:
#   sudo certbot --nginx -d shopify.gazaarabia.com
# certbot rewrites the server block to add the 443 listener + certificate paths.

server {
    listen 80;
    listen [::]:80;
    server_name shopify.gazaarabia.com;

    # Proxy everything to the Node/Remix app managed by PM2 on port 3001.
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # Shopify webhooks/OAuth are plain HTTP requests; no websocket needed,
        # but these keep upgrades working if you add any later.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 60s;
    }

    # Allow larger webhook/product payloads.
    client_max_body_size 5m;
}
